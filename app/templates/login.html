{% extends "base.html" %}
{% block title %}Sign in - Daily Recon{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:12vh auto 0">
  <h1>Admin sign in</h1>
  {% if error %}<p class="pill fail">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <p><label>Username<br><input type="text" name="username" autocomplete="username" required autofocus></label></p>
    <p><label>Password<br><input type="password" name="password" autocomplete="current-password" required></label></p>
    <button class="btn primary" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
