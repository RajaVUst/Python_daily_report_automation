<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Daily Recon{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#667085; --line:#e4e7ec; --brand:#2563eb;
          --ok:#12805c; --okbg:#d9f3e7; --bad:#b42318; --badbg:#fde4e1; --warn:#946200; --warnbg:#fff1c9; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink) }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap }
  header a { color:var(--ink); text-decoration:none } header .brand { font-weight:700 }
  header .sp { flex:1 }
  main { max-width:1000px; margin:20px auto; padding:0 16px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px }
  h1 { font-size:20px; margin:0 0 12px } h2 { font-size:16px; margin:0 0 10px }
  .muted { color:var(--mute) }
  table { width:100%; border-collapse:collapse; font-size:14px }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top }
  .table-wrap { overflow-x:auto }
  .btn { border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:8px; font:inherit; cursor:pointer }
  .btn:hover { background:#f2f4f7 }
  .btn.primary { background:var(--brand); color:#fff; border-color:var(--brand) }
  .btn.danger { background:var(--bad); color:#fff; border-color:var(--bad) }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600 }
  .pass,.success,.on { background:var(--okbg); color:var(--ok) }
  .fail,.failed,.killed { background:var(--badbg); color:var(--bad) }
  .error,.running,.queued { background:var(--warnbg); color:var(--warn) }
  .off { background:#eef0f3; color:var(--mute) }
  input[type=text],input[type=password],textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit }
  pre { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:8px; overflow:auto; font-size:13px }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:8px; display:none }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px }
  .kv b { display:block; font-size:12px; color:var(--mute); font-weight:500 }
</style>
</head>
<body>
{% if user %}
<header>
  <span class="brand">Daily Recon</span>
  <a href="/">Dashboard</a><a href="/config">Config</a>
  <span class="sp"></span>
  <span class="muted">{{ user }}</span>
  <form method="post" action="/logout" style="margin:0"><button class="btn">Log out</button></form>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
<div class="toast" id="toast"></div>
<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
